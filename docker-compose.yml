# Esecuzione in casa, su un container LXC di Proxmox. Anche il database sta
# qui: è il servizio `db`, raggiunto dagli altri container come `db:5432`.
#
#   docker compose build                 costruisce l'immagine
#   docker compose run --rm migrate      applica le migrazioni
#   docker compose up -d                 avvia database e applicazione
#
# Il servizio `cloudflared` sta dietro il profilo `public` e resta spento
# finché non c'è un dominio: per accenderlo basta aggiungere
# `COMPOSE_PROFILES=public` al file `.env`.

name: finanze

x-logging: &logging
  driver: json-file
  options:
    # Senza un tetto i log crescono finché non riempiono il disco dell'LXC.
    max-size: "10m"
    max-file: "3"

services:
  # Postgres locale. Non pubblica nessuna porta: lo raggiungono solo gli altri
  # servizi, sulla rete interna di Compose. Per un `psql` a mano:
  # `docker compose exec db psql -U finanze`.
  #
  # `PG_IMAGE` è la stessa che usa `backup`, di proposito: `pg_dump` non legge
  # un server più recente di sé, quindi tenerle allineate evita l'errore. Alzare
  # la versione *maggiore* su un volume già popolato non è però un cambio di
  # tag: il server si rifiuta di partire sui dati di una versione precedente e
  # serve un dump e un restore (vedi README).
  db:
    image: ${PG_IMAGE:-postgres:18}
    environment:
      POSTGRES_USER: finanze
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?imposta POSTGRES_PASSWORD nel .env}
      POSTGRES_DB: finanze
    volumes:
      # Dalla 18 l'immagine tiene i dati in una sottocartella versionata di
      # /var/lib/postgresql: montare il volume su `.../data`, come si faceva
      # prima, lascerebbe i dati fuori dal volume e li perderebbe a ogni
      # ricreazione del container.
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finanze -d finanze"]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 5
    restart: unless-stopped
    logging: *logging

  app:
    build:
      context: .
      target: runner
    image: finanze-app
    env_file: .env
    ports:
      # Pubblicata sulla LAN: finché non c'è il tunnel questo è l'unico modo di
      # raggiungere l'applicazione, e resta il più diretto anche dopo.
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      # `fetch` globale di Node 22: evita di installare curl solo per questo.
      test:
        - CMD
        - node
        - -e
        # Apici singoli YAML e doppi in JavaScript: `? 0 : 1` senza virgolette
        # verrebbe letto come una mappa e il file non validerebbe più.
        - 'fetch("http://127.0.0.1:3000/api/health").then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))'
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    logging: *logging

  # Container usa e getta: `docker compose run --rm migrate`. Il profilo lo
  # tiene fuori da `up`, ma `run` lo attiva da solo quando serve, e con lui
  # avvia anche `db` se è spento.
  migrate:
    build:
      context: .
      target: migrator
    image: finanze-migrator
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    profiles: ["tools"]
    restart: "no"
    logging: *logging

  # Dump del database in una cartella della macchina, lanciato da
  # `backup-db.sh`. Il database vive in un volume Docker sullo stesso disco:
  # questa copia protegge da una migrazione sbagliata o da un `docker compose
  # down -v`, ma per sopravvivere alla perdita del disco va portata anche fuori
  # dall'LXC.
  backup:
    image: ${PG_IMAGE:-postgres:18}
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ${BACKUP_DIR:-/var/backups/finanze}:/backups
    profiles: ["tools"]
    restart: "no"
    logging: *logging

  # Espone l'applicazione su internet senza aprire porte sul router: la
  # connessione parte da qui verso Cloudflare. Richiede `TUNNEL_TOKEN` nel
  # `.env` e un hostname pubblico configurato che punti a `http://app:3000`.
  cloudflared:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate run
    env_file: .env
    profiles: ["public"]
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped
    logging: *logging

volumes:
  pgdata:
