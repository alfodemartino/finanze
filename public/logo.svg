     (`text-tint`); usato come immagine vale il blu dichiarato qui sotto. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64"
     color="#007aff" role="img" aria-label="Splitter">
  <defs>
    <mask id="fessura" maskUnits="userSpaceOnUse" x="0" y="0" width="64" height="64">
      <rect width="64" height="64" fill="#fff" />
      <path d="M28.6-6 40.6 70 37 70 25-6Z" fill="#000" />
    </mask>
  </defs>
  <g mask="url(#fessura)" fill="none" stroke="currentColor" stroke-width="6.5" stroke-linecap="round">
    <path d="M46.6 18.2A19.4 19.4 0 1 0 46.6 45.8" />
    <path d="M11.5 27H41" />
    <path d="M11.5 38H41" />
  </g>
</svg>
